version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      # Persist the SQLite database across container rebuilds
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Relative path — nginx proxies /api → backend. No host needed.
        VITE_API_BASE: /api/v1
        VITE_API_KEY: ${API_KEY:-changeme}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes: {}
