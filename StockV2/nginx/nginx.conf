server {
    listen 80;
    server_name _;

    # Gzip for performance
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # ── API: proxy to FastAPI backend ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Never cache API responses — data must always come from the backend
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
        expires    off;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://backend:8000/health;
        add_header Cache-Control "no-store";
    }

    # ── Frontend: serve React SPA ─────────────────────────────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # index.html must never be cached — it references hashed JS/CSS bundles
        # and browsers serving a stale index.html will load the wrong bundle
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";

        # JS/CSS/images have content hashes in their filenames — safe to cache forever
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
